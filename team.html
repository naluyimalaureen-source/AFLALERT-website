<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — AflAlert App</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { font-family:'Poppins',sans-serif; }

body {
  background:#f8f6f0;
  color:#333;
  animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

header { position:fixed; top:0; width:100%; background:#1B5E3C; z-index:1000; box-shadow:0 3px 10px rgba(0,0,0,.2); }
.navbar { width:90%; max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center; padding:14px 0; flex-wrap:wrap; gap:10px; }
.logo { font-size:22px; font-weight:700; color:white; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.logo img { height:44px; width:auto; border-radius:6px; }
.logo span { color:#D4AF37; }
.nav-links { display:flex; gap:16px; flex-wrap:wrap; }
.nav-links a { color:white; text-decoration:none; font-size:14px; white-space:nowrap; transition:.3s; }
.nav-links a:hover { color:#D4AF37; }

@media (max-width: 600px) {
  .section-title { font-size:26px; }
  .navbar { padding:10px 0; }
  .logo { font-size:18px; }
}

section { width:90%; max-width:1200px; margin:auto; padding:80px 0; }
section:first-of-type { padding-top:140px; }
.section-title { text-align:center; color:#1B5E3C; font-size:38px; margin-bottom:15px; }
.line { width:90px; height:4px; background:#D4AF37; margin:0 auto 40px; }

.team-container { display:flex; justify-content:center; gap:25px; flex-wrap:wrap; }
.team-card { background:white; width:220px; padding:30px; text-align:center; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,.08); opacity:0; transform:translateY(40px); transition:opacity .6s ease, transform .6s ease; }
.team-card.in-view { opacity:1; transform:translateY(0); }
.team-card:hover { transform:translateY(-8px); }
.team-card i { font-size:45px; color:#1B5E3C; margin-bottom:20px; }
.team-card h3 { color:#1B5E3C; font-size:18px; }

.mentor-box { background:#1B5E3C; color:white; padding:40px; border-radius:15px; text-align:center; max-width:500px; margin:auto; opacity:0; transform:translateY(40px); transition:opacity .6s ease, transform .6s ease; }
.mentor-box.in-view { opacity:1; transform:translateY(0); }
.mentor-box i { font-size:50px; color:#D4AF37; margin-bottom:20px; }

footer { background:#1B5E3C; color:white; text-align:center; padding:35px; }
footer h3 { color:#D4AF37; margin-bottom:10px; }
footer a { color:#e6ecf5; text-decoration:none; }
</style>
</head>

<body>

<div class="menu-container"></div>
<script src="js/menu.js"></script>

<section id="team">
  <h2 class="section-title">Our Team</h2>
  <div class="line"></div>
  <div class="team-container">
    <div class="team-card"><i class="fas fa-user"></i><h3>NABACHWA PRISCILLA LUTAYA</h3><p>25/U/0350</p></div>
    <div class="team-card"><i class="fas fa-user"></i><h3>ATWINE SHEILA BAGUMIRE</h3><p>25/U/03348/EVE</p></div>
    <div class="team-card"><i class="fas fa-user"></i><h3>KIZITO JUMA</h3><p>25/U/26620</p></div>
    <div class="team-card"><i class="fas fa-user"></i><h3>NALUYIMA LAUREEN</h3><p>25/U/03511/PS</p></div>
    <div class="team-card"><i class="fas fa-user"></i><h3>NSUBUGA BRIAN</h3><p>25/U/03546/PSA</p></div>
  </div>
</section>

<section id="mentor">
  <h2 class="section-title">Project Mentor</h2>
  <div class="line"></div>
  <div class="mentor-box">
    <i class="fas fa-user-tie"></i>
    <h3>MR. PADDY ASIIMWE</h3>
    <p>Project Mentor / Supervisor</p>
  </div>
</section>

<div class="footer-container"></div>
<script src="js/footer.js"></script>

<script src="js/scroll-reveal.js"></script>
</body>
</html>
